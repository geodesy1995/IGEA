[postGIS]
host=localhost
user=user
dbname=db
port=5432
passwordfile=./config/pw.txt

[nca]
osm_tag_location=./config/osmTagKeyWiki.csv
osm_key_location=./config/osmKeyWiki.csv
columns_location=
relevance_threshold=100
prediction_threshold=0.3
latent_space=30
num_epochs=100
train_verbose=1
adversarial_lambda=1.0

[dbpedia scrape]
dbpedia_source=en
country=Ireland
entity_source=country

[wikidata scrape]
country_id=Q27
scrape_values=name, popularity, type labels, full properties
name_language=en

[candidate generation]
method=distance
max_candidates=100
dist_threshold=2500
max_candidate_area_m2=50000000
max_train_false_per_entity=20
query_timeout_ms=120000

[fasttext]
location=./models/fasttext/cc.en.300.bin

[entity linking]
attention=True
attention_dimension=64
linear_dimension=32
epochs=3
train_verbose=1
prediction_threshold=0.5
max_sequence_length=128
max_vocabulary_size=50000
batch_size=512
predict_batch_size=1024
early_stopping_patience=1
use_class_weight=True
split_strategy=group
split_group_column=wkid
write_predictions_to_db=True
base_table=ireland_features
view_name=tempview
index_name=spatial_index
prediction_table=predicted_entities

[experiment]
name=ireland_dbpedia_smoke_all_spatial

[spatial context]
variant=all_spatial
features=dist,bearing_sin,bearing_cos,d_lat,d_lon
encoder_units=16,8

[llm verifier]
enabled=False
provider=dummy
margin=0.10
cost_per_1k_calls=0
model=gpt-4o-mini
timeout_seconds=30
max_output_tokens=180
max_calls=0
log_filename=llm verifier log.tsv

[meta]
data_folder=./data/smoke_ireland_dbpedia/
num_iterations=1
kg_source=dbpedia

[legacy]
use_legacy_embeddings=False
num_epochs=25
embedding_dim=300
model=r_forest
do_oversampling=True

[misc]
testrun=True
limit=500

[quality gates]
min_train_true=20
min_train_rows=200
min_test_true_support=5
min_prediction_true_support=5
require_nonzero_bbox=False
retry_dist_threshold=
retry_max_candidates=
seeds=42

[gold split]
enabled=True
seed_fraction=0.8
random_seed=42
heldout_table=heldout_entities
