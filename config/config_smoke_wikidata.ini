[postGIS]
host=localhost
user=user
dbname=db
port=5432
passwordfile=./config/pw.txt

[nca]
osm_tag_location=./config/osmTagKeyWiki.csv
osm_key_location=./config/osmKeyWiki.csv
columns_location=
relevance_threshold=100
prediction_threshold=0.3
latent_space=30
num_epochs=100
train_verbose=1

[dbpedia scrape]
dbpedia_source=en
country=Ireland

[wikidata scrape]
country_id=Q27
scrape_values=name, popularity, type labels, full properties
name_language=en

[candidate generation]
method=distance
max_candidates=100
dist_threshold=2500

[fasttext]
location=./models/fasttext/cc.en.300.bin

[entity linking]
attention=True
attention_dimension=64
linear_dimension=32
epochs=40
train_verbose=1
prediction_threshold=0.6
base_table=ireland_nodes
view_name=tempview
index_name=spatial_index
prediction_table=predicted_entities

[experiment]
name=ireland_wikidata_smoke_all_spatial

[spatial context]
variant=all_spatial
features=dist,bearing_sin,bearing_cos,d_lat,d_lon,bbox_overlap
encoder_units=16,8

[llm verifier]
enabled=False
provider=dummy
margin=0.10
cost_per_1k_calls=0
log_filename=llm verifier log.tsv

[meta]
data_folder=./data/smoke_ireland_wikidata/
num_iterations=1
kg_source=wikidata

[legacy]
use_legacy_embeddings=False
num_epochs=25
embedding_dim=300
model=r_forest
do_oversampling=True

[misc]
testrun=True
limit=4000
